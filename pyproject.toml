[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustgraph"
version = "0.1.0"
description = "Detect CrossCurve-style smart contract trust-boundary vulnerabilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
trustgraph = "trustgraph.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["trustgraph*"]

[tool.pytest.ini_options]
addopts = "-p no:web3"
testpaths = ["tests"]
